<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cont{
            width: 800px;
            margin: 0 auto;
            background-color: rgb(240, 227, 208);
        }

        h1{
            text-align: center;
        }

        .wrap{
    
            height: 400px;
            overflow: hidden;
            position: relative;
        }

            


        .pics{
            width: 100px;
            height: 100px;
            margin: 20px;
            display: block;
            position: absolute;
        }

        .p1{
            /* transform: scale(1.6); */
            transform: rotate(-30deg);
            /* transform: scale(0.6); */
            left: 400px;
            top: 100px;

        }

    </style>
</head>
<body>
    <div class="cont">
        <h1>HELLO MY SITE</h1>
        <div class="wrap">
            <div class="pics p1"><img width="50%" src="calc.png" alt=""></div>
            <div class="pics p2"><img src="book.png" alt=""></div>
            <div class="pics p3"><img src="paper.png" alt=""></div>
            <div class="pics p4"><img src="pallete.png" alt=""></div>
            <div class="pics p5"><img src="pencil.png" alt=""></div>
        </div>
    </div>
</body>
</html>
