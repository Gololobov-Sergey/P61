<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .block{
            width: 500px;
            height: 500px;
            text-align: center;
            margin: 100px auto;

        }
        img{
            width: 20%;
            height: 20%;
            filter: grayScale(100%);
        }

        img:hover{
            filter: grayScale(0%);
            transform: scale(3);
            transition: all 1s ease-out 0s;
        }
    </style>
</head>
<body>
        <div class="block">
            <img src="favorites.png" alt="">
        </div>
</body>
</html>
