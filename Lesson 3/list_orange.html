<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cont{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 800px;
            margin: auto;
            background-color: rgb(245, 245, 245);
            padding: 20px 30px;
            font-size: 20px;
        }

        ol{
            background-color: rgb(237, 158, 174);
            color: rgb(243, 241, 237);
            list-style-position: inside;
            padding-left: 0;
        }

        li{
            background-color: rgb(198, 99, 118);
            padding: 15px;
            margin: 15px 0;
        }

        span{
            background-color:#9e354b;
            padding: 15px 25px;
            margin-left: 15px;
        }

        
    </style>
</head>
<body>
    <div class="cont">
        <ol>
            <li><span>Appale</span></li>
            <li><span>Orange</span></li>
            <li><span>Pineapple</span></li>
            <li><span>Pear</span></li>
            <li><span>Cherry</span></li>
        </ol>
    </div>

</body>
</html>
