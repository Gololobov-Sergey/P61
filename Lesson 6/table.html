<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border: 2px solid black;
            background-color: rgb(245, 242, 87);
            border-collapse: separate;
            empty-cells: hide;
            border-spacing: 20px;
        }

        tr{
            border: 2px solid rgb(110, 16, 233);
        }

        td, th{
            border: 2px solid rgb(235, 23, 23);
            padding: 10px 20px;
            width: 100px;
            background-color: rgb(64, 228, 105);
            text-align: center;
        }

        .c1{
            height: 100px;
            width: 200px;
            background-image: url(../Lesson%205/pallete.png);
        }
        </style>
</head>
<body>
    <table>
        <tr>
            <th>1</th>
            <th >2</th>
            <th>3</th>
            <th>4</th>
        </tr>
        <tr>
            <td>1</td>
            <td class="c1">2</td>
            <td>323423423</td>
            <td>3</td>
        </tr>
        <tr>
            <td></td>
            <td>2</td>
            <td>2</td>
            <td></td>
        </tr>
    </table>
</body>
</html>
