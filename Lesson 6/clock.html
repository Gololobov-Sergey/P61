<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .ramka{
            width: 400px;
            height: 400px;
            border-radius: 50%;
            border: 5px solid black;
            position: relative;
            margin: 0 auto;
        }

        .hour{
            width: 10px;
            height: 100px;
            background-color: black;
            position: absolute;
            top: 100px;
            left: 195px;
            transform-origin: bottom center;
            /* transform: rotate(90deg); */

            animation: anime 36s linear 0s infinite ;
        }

        .minutes{
            width: 5px;
            height: 150px;
            background-color: black;
            position: absolute;
            top: 50px;
            left: 197.5px;
            transform-origin: bottom center;
            /* transform: rotate(-45deg); */

            animation: anime 3s linear 0s infinite ;

        }

        .punkt{
            width: 20px;
            height: 20px;
            background-color: black;
            border-radius: 50%;
            position: absolute;
            top: 190px;
            left: 190px;

        }

        @keyframes anime{
            0%{
                transform: rotate(0deg);
            }
            100%{
                transform: rotate(360deg);
            }
        }
        </style>
</head>
<body>
    <div class="ramka">
        <div class="hour"></div>
        <div class="minutes"></div>
        <div class="punkt"></div>
    </div>
</body>
</html>
