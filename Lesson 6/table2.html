<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            
            border-collapse: collapse;
            
        }

        td{
            border: 2px solid rgb(110, 16, 233);
            width: 100px;
            height: 50px;
            text-align: center;
        }
        .cell{
            height: 100px;
        }

        </style>
</head>
<body>

            <td colspan="2">item1</td>
            <td rowspan="4">item2</td>
            <td>item3</td>
            <!-- <td>item4</td> -->
        </tr>
        <tr>
            <td rowspan="2" colspan="2" class="cell">item5</td>
            <td class="cell">item6</td>
            <!-- <td>item7</td> -->
            <!-- <td>item8</td> -->
        </tr>
        <tr>
            <td rowspan="2">item9</td>
            <!-- <td>item10</td> -->
            <!-- <td>item11</td> -->
            <!-- <td>item12</td> -->
        </tr>
        <tr>
            <td>item13</td>

            <!-- <td>item16</td> -->
        </tr>
    </table>
</body>
</html>
